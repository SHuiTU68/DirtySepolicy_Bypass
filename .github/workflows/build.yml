name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Android NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "${ANDROID_NDK_HOME:-}" ]; then
            NDK_DIR="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$NDK_DIR" ]; then
              echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            else
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              sdkmanager --install "ndk;26.1.10909125"
              echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
            fi
          fi
          echo "Using NDK: ${ANDROID_NDK_HOME:-$SDK/ndk}"

      - name: Build all ABIs and package zip
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirtysepbypass-module
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
