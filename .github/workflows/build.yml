name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The module has to match the KMI of this exact kernel; keep it in sync with
  # the default in tools/build.sh.
  KERNEL_SHA: 1d453aabd9c290bc7d185626b9542eae1cf0b1f6

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make bc flex bison libelf-dev libssl-dev \
            dwarves python3 curl zstd

      # modules_prepare costs a couple of minutes; the source tree itself is
      # cheaper to download again than to cache (1.5 GiB extracted).
      - name: Cache prepared kernel headers
        uses: actions/cache@v4
        with:
          path: .kout
          key: kout-${{ env.KERNEL_SHA }}-v2

      - name: Build dsb_kmod.ko and package the module zip
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh

      - name: Inspect the zip
        run: |
          ls -l dist/
          python3 - <<'PY'
          import glob
          import zipfile
          for path in glob.glob("dist/*.zip"):
              with zipfile.ZipFile(path) as zf:
                  print(path)
                  for info in zf.infolist():
                      print("  %s %7d %s" % (oct(info.external_attr >> 16),
                                             info.file_size, info.filename))
          PY

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirtysepbypass-module
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
